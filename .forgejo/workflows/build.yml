name: build

enable-openid-connect: true

on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - v*

jobs:
  test:
    runs-on: alpine
    steps:
      - uses: actions/toolkit/git-checkout@master
      - uses: actions/toolkit/go-setup@master
      - uses: actions/toolkit/go-test@master

  plugin:
    runs-on: alpine
    needs: [test]
    env:
      IMAGE: git.mouse-lake.ts.net/greboid/compose-sops
    steps:
      - uses: actions/toolkit/git-checkout@master
      - uses: actions/toolkit/go-setup@master
      - name: Install build tools
        run: apk add --no-cache gzip jq skopeo tar
      - name: Build
        run: plugin/build.sh dist
      - uses: actions/toolkit/docker-login@master
        with:
          audience: u:1:4f4cf699-68d9-42df-bf4a-cde3e743783f
      - name: Push
        run: |
          set -eu
          case "$GITHUB_REF" in
            refs/tags/v*) tags="${GITHUB_REF_NAME#v} latest" ;;
            *) tags="dev" ;;
          esac
          for tag in $tags; do
            skopeo copy --preserve-digests --authfile "$DOCKER_CONFIG/config.json" \
              oci:dist/oci:latest "docker://$IMAGE:$tag"
          done
